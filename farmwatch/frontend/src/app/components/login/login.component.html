<!-- src/app/components/login/login.component.html -->
<div class="login-shell">

  <!-- Background grid -->
  <div class="grid-bg"></div>

  <!-- Scan line effect -->
  <div class="scanline"></div>

  <div class="login-card">

    <!-- Logo area -->
    <div class="logo-area">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 2"/>
          <path d="M20 8 C14 8 10 13 10 20 C10 24 12 27 15 29 L20 32 L25 29 C28 27 30 24 30 20 C30 13 26 8 20 8Z"
                stroke="currentColor" stroke-width="1.2" fill="none"/>
          <circle cx="20" cy="18" r="3" fill="currentColor"/>
          <path d="M16 26 Q20 22 24 26" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-main">FARM<span class="accent">WATCH</span></span>
        <span class="logo-sub">Bird Detection System</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-label">SECURE ACCESS</span>
      <span class="divider-line"></span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="login()" autocomplete="off">

      <div class="field">
        <label class="field-label">USERNAME</label>
        <div class="field-input-wrap">
          <input
            type="text"
            class="field-input"
            [(ngModel)]="username"
            name="username"
            placeholder="admin"
            autocomplete="username"
            readonly />
          <span class="field-icon">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4z"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label class="field-label">PASSWORD</label>
        <div class="field-input-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="field-input"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            [class.error]="error"
            (keyup.enter)="login()" />
          <button type="button" class="field-icon btn-icon" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 16 16" fill="currentColor">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 16 16" fill="currentColor">
              <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
              <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
              <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error message -->
      <div class="error-msg" *ngIf="error">
        <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
          <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
          <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
        </svg>
        {{ error }}
      </div>

      <button type="submit" class="submit-btn" [class.loading]="loading" [disabled]="loading || !password">
        <span *ngIf="!loading">ACCESS SYSTEM</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

    <!-- Footer -->
    <div class="card-footer">
      <span class="footer-dot"></span>
      <span>Raspberry Pi 4 — FarmWatch v1.0</span>
      <span class="footer-dot"></span>
    </div>
  </div>
</div>
