<!-- change-password.component.html -->
<div class="modal-overlay" (click)="closed.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">Change Password</span>
      <button class="close-btn" (click)="closed.emit()">✕</button>
    </div>

    <div class="field">
      <label class="field-label">Current password</label>
      <input type="password" class="field-input" [(ngModel)]="currentPassword" placeholder="Current password" />
    </div>
    <div class="field">
      <label class="field-label">New password</label>
      <input type="password" class="field-input" [(ngModel)]="newPassword" placeholder="Min 6 characters" />
    </div>
    <div class="field">
      <label class="field-label">Confirm new password</label>
      <input type="password" class="field-input" [(ngModel)]="confirmPassword" placeholder="Repeat new password" />
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>
    <div class="success-msg" *ngIf="success">{{ success }}</div>

    <button class="submit-btn" (click)="submit()" [disabled]="loading || !currentPassword || !newPassword">
      {{ loading ? 'Saving...' : 'Save Password' }}
    </button>
  </div>
</div>
